name: Stage Core Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DASHSCOPE_API_KEY: ""
      PROVIDER_CALLS_AUTHORIZED: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10.20"
      - name: Install exact validation environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip check
      - name: Validate the distributed stage snapshot
        run: python -X utf8 scripts/run_stage_validation.py --out-dir output/local_validation/ci
      - name: Print actual validation report
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("output/local_validation/ci/validation.json")
          if p.is_file():
              print(p.read_text(encoding="utf-8"))
          PY
