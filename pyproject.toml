[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
  "archive",
  "freeze_evidence",
  "output",
  "provenance",
  "temporary",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.codesentry-gen]
runtime-contract = "config/core_runtime_environment_v1.json"
core-lock = "requirements-core-lock.txt"
dev-lock = "requirements-dev.txt"
offline-suite = "python scripts/run_offline_core_suite.py"
provider-calls-authorized = 0
